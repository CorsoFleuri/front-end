<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Gourmand - Commande Express</title>
  <link rel="stylesheet" href="menu2.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      margin: 0;
      padding-bottom: 240px; 
    }
    .header {
      text-align: center;
      padding: 10px;
    }
    .header img {
      width: 200px;
      height: auto;
    }
    .back-button-container {
      margin: 10px;
      text-align: left;
    }
    .back-button {
      font-size: 22px;
      padding: 12px;
      background-color: #eee;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      color: #333;
      margin: 10px;
      display: inline-block;
    }
    .category-container {
      text-align: center;
      margin: 20px;
    }
    .category-title {
      font-size: 32px;
      margin-top: 20px;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .product-button {
      width: 150px;
      height: 170px;
      border: none;
      background-color: #fff;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .product-button img {
      width: 100px;
      height: 100px;
      object-fit: cover;
    }

    .selected-products {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 220px;
      background-color: #f8f8f8;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      text-align: center;
      border-radius: 10px;
      font-size: 16px;
    }
    .selected-products h2 {
      font-size: 18px;
      margin: 0 0 10px 0;
    }
    .selected-products ul {
      list-style: none;
      padding: 0;
      margin: 10px 0;
      font-size: 16px;
      max-height: 150px;
      overflow-y: auto;
    }
    .validate-button {
      font-size: 16px;
      padding: 8px 16px;
      border: none;
      border-radius: 10px;
      background-color: #009933;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../assets/logo.png" alt="Logo">
  </div>
  <div class="back-button-container">
    <a href="/borne/borne_panier.html" class="back-button">Retour</a>
  </div>

  <div id="category-container" class="category-container">
  </div>

  <div class="selected-products">
    <h2>Votre commande</h2>
    <ul id="selected-items-list">
    </ul>
    <button class="validate-button" onclick="validateCart()">Valider</button>
  </div>

  <script>
    const categories = [
      {
        name: 'Plats',
        products: [
          { name: 'Pâtes', image: '../assets/pate.png' },
          { name: 'Frites', image: '../assets/frite.png' }
        ]
      },
      {
        name: 'Desserts',
        products: [
          { name: 'Glace', image: '../assets/glace.png' },
          { name: 'Fraise', image: '../assets/fraise.png' }
        ]
      },
      {
        name: 'Boissons',
        products: [
          { name: 'Eau', image: '../assets/eau.png' },
          { name: 'Jus', image: '../assets/jus.png' }
        ]
      }
    ];

    let currentCategoryIndex = 0;
    const selectedItems = [];

    function loadCategory() {
      const container = document.getElementById('category-container');
      container.innerHTML = '';

      if (currentCategoryIndex < categories.length) {
        const category = categories[currentCategoryIndex];

        const title = document.createElement('h2');
        title.className = 'category-title';
        title.textContent = category.name;
        container.appendChild(title);

        const productsDiv = document.createElement('div');
        productsDiv.className = 'products';

        category.products.forEach(product => {
          const btn = document.createElement('button');
          btn.className = 'product-button';
          btn.onclick = function() { selectItem(product.name); };

          const img = document.createElement('img');
          img.src = product.image;
          img.alt = product.name;
          btn.appendChild(img);

          const span = document.createElement('span');
          span.textContent = product.name;
          btn.appendChild(span);

          productsDiv.appendChild(btn);
        });
        container.appendChild(productsDiv);
      } else {
        const message = document.createElement('h2');
        message.className = 'category-title';
        message.textContent = "Merci pour votre commande !";
        container.appendChild(message);
      }
    }

    function selectItem(item) {
      selectedItems.push(item);
      const list = document.getElementById("selected-items-list");
      const newItem = document.createElement("li");
      newItem.textContent = item;
      list.appendChild(newItem);

      currentCategoryIndex++;
      loadCategory();
    }

    function validateCart() {
      alert("Commande validée : " + selectedItems.join(", "));
    }

    loadCategory();
  </script>
</body>
</html>
