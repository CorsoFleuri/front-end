<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne</title>
    <link rel="stylesheet" href="menu2.css">
    <link rel="stylesheet" href="../borne/borne_panier.css">
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #fff;
        margin: 0;
        padding-bottom: 240px
    }

    .header {
        text-align: center;
        padding: 10px;
    }

    .header img {
        width: 200px;
        height: auto;
    }

    .back-button-container {
        margin: 10px;
        text-align: left;
    }

    .back-button {
        font-size: 22px;
        padding: 12px;
        background-color: #eee;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        color: #333;
        margin: 10px;
        display: inline-block;
    }

    .category-container {
        text-align: center;
        margin: 20px;
    }

    .category-title {
        font-size: 32px;
        margin-top: 20px;
    }

    .products {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }

    .product-button {
        width: 150px;
        height: 170px;
        border: none;
        background-color: #fff;
        cursor: pointer;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }

    .product-button img {
        width: 100px;
        height: 100px;
        object-fit: cover;
    }

    .selected-products {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 220px;
        background-color: #f8f8f8;
        padding: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        text-align: center;
        border-radius: 10px;
        font-size: 16px;
    }

    .selected-products h2 {
        font-size: 18px;
        margin: 0 0 10px 0;
    }

    .selected-products ul {
        list-style: none;
        padding: 0;
        margin: 10px 0;
        font-size: 16px;
        max-height: 150px;
        overflow-y: auto;
    }

    .validate-button {
        font-size: 16px;
        padding: 8px 16px;
        border: none;
        border-radius: 10px;
        background-color: #009933;
        color: #fff;
        cursor: pointer;
    }

    .validate-button:disabled {
        background-color: #cccccc;
        color: #666666;
        cursor: not-allowed;
    }
</style>
<body>
    <div class="header">
        <img src="../assets/logo.png" alt="Logo">
    </div>

    <div class="buttons-container">
        <button id="menu-button">Menu</button>
        <button id="products-button">Produits</button>
    </div>

    <div class="selected-products">
        <h2>Votre commande</h2>
        <ul id="selected-items-list">
        </ul>
        <button type="button" class="validate-button" id="add-to-cart" disabled>Valider</button>
    </div>

    <div class="main" id="main-content"> </div>

    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2>Choisissez votre mode de paiement</h2>
            <div class="payment-buttons">
                <button class="payment-button" data-method="cash">Espèces</button>
                <button class="payment-button" data-method="credit-card">Carte Bancaire</button>
                <button class="payment-button" data-method="sumup">SumUp</button>
                <button class="payment-button" data-method="vip">VIP</button>
            </div>
        </div>
    </div>

    <script src="menu3.js" type="module"></script>
</body>

</html>
